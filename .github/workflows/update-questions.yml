name: Aggiorna archivio Football Legends
on:
  workflow_dispatch:
  schedule:
    - cron: '25 6 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node scripts/build-bank.js
      - name: Genera domande su calciatori e allenatori
        run: node scripts/build-people.js
      - name: Pubblica solo se cambia il dataset
        run: |
          git config user.name 'football-legends-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add questions-generated.json people-generated.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna archivio domande dal calcio storico'
            git push
          fi
